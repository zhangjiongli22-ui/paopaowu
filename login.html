<body>
<script>if(location.protocol==="http:")location.replace("https:"+location.href.slice(5));</script>

<main class="page">
  <header class="page-head">
    <p class="kicker">ADMIN</p>
    <h1>登录</h1>
    <p class="lead">登录之后才能改评分和评价。</p>
  </header>

  <form class="login-box" id="login-form">
    <label>账号<input type="text" id="login-user" autocomplete="username" placeholder="kira"></label>
    <label>密码<input type="password" id="login-pass" autocomplete="current-password"></label>
    <button type="submit" class="lb-btn">登录</button>
    <p class="rate-msg" id="login-msg"></p>
  </form>
</main>

<footer>
  <p>© 2026 Kira &amp; 大肥鱼 · <a href="legal.html">声明</a></p>
</footer>

<script>
const HASH = "6f65bb65";
function h(s) {
  let x = 5381;
  for (let i = 0; i < s.length; i++) {
    x = ((x << 5) + x) ^ s.charCodeAt(i);
    x >>>= 0;
  }
  return x.toString(16);
}
document.getElementById("login-form").addEventListener("submit", (e) => {
  e.preventDefault();
  const u = document.getElementById("login-user").value.trim();
  const p = document.getElementById("login-pass").value;
  const msg = document.getElementById("login-msg");
  if (h(`${u}:${p}:paopaowu`) === HASH) {
    localStorage.setItem("paopaowu_admin", String(Date.now()));
    msg.textContent = "登录成功，回去改评分吧";
    setTimeout(() => (location.href = "records.html"), 600);
  } else {
    msg.textContent = "账号或密码不对";
  }
});
</script>
<script>
(function () {
  if (!localStorage.getItem("paopaowu_admin")) return;
  document.querySelectorAll('footer a[href="login.html"]').forEach(function (a) {
    a.textContent = "Kira";
    a.style.color = "#ffd76a";
    a.title = "已登录";
  });
})();
</script>
</body>
</html>
