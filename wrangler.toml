name = "paopaowu"
main = "worker.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/data/records.json", "/data/chat.json", "/api/rate"]

[[kv_namespaces]]
binding = "RATINGS"
id = "87a2a3299e8a4b6ca3c411000d4f5811"

# 图片存 R2（10GB 免费额度）；老图仍在 KV，worker 读的时候先 R2 后 KV
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "paopaowu-media"
