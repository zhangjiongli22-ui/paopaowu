<script>
(async function () {
  function esc(t) { return String(t == null ? "" : t).replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; }); }
  function dayOf(dateStr, timeStr) {
    if (!dateStr) return "";
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(dateStr).trim());
    if (!m) return String(dateStr);
    var hh = parseInt(String(timeStr || "12:00").slice(0, 2), 10);
    var d = new Date(+m[1], +m[2] - 1, +m[3]);
    if (!isNaN(hh) && hh < 4) d.setDate(d.getDate() - 1);
    var pad = function (n) { return String(n).padStart(2, "0"); };
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }
  var host = document.getElementById("crit-list");
  try {
    var data = await (await fetch("data/records.json", { cache: "no-store" })).json();
    var all = (data.items || []).filter(function (x) { return x.cat === "critique"; });
    if (!all.length) { host.innerHTML = '<p class="loading">还没有锐评。</p>'; return; }
    var byDay = {};
    all.forEach(function (x) { var d = dayOf(x.date, x.time) || "未记"; (byDay[d] = byDay[d] || []).push(x); });
    var days = Object.keys(byDay).sort().reverse();
    host.innerHTML = days.map(function (d) {
      var rows = byDay[d].slice().sort(function (a, b) { return String(a.time || "").localeCompare(String(b.time || "")); });
      var main = rows.filter(function (x) { return x.who === "大肥鱼"; })[0] || rows[0];
      var replies = rows.filter(function (x) { return x !== main; });
      return '<section class="cmt-day">' +
        '<p class="cmt-date">' + esc(d) + "</p>" +
        '<article class="cmt cmt-main ' + (main.who === "大肥鱼" ? "fish" : "dsh") + '">' +
          '<header class="cmt-head"><span class="cmt-who">' + esc(main.who || "") + '</span>' +
          '<span class="cmt-time">' + esc(main.time || "") + "</span></header>" +
          '<p class="cmt-text">' + esc(main.text || "") + "</p>" +
        "</article>" +
        replies.map(function (x) {
          return '<article class="cmt cmt-reply ' + (x.who === "大肥鱼" ? "fish" : "dsh") + '">' +
            '<header class="cmt-head"><span class="cmt-who">' + esc(x.who || "") + '</span>' +
            '<span class="cmt-to">回复 ' + esc(x.reply_to || main.who || "") + '</span>' +
            '<span class="cmt-time">' + esc(x.time || "") + "</span></header>" +
            '<p class="cmt-text">' + esc(x.text || "") + "</p></article>";
        }).join("") +
        "</section>";
    }).join("");
  } catch (e) {
    host.innerHTML = '<p class="loading">没加载出来。</p>';
  }
})();
</script>
