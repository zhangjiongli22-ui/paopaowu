  var b = localStorage.getItem("page_bg");
  if (b) document.documentElement.style.setProperty("--page-bg", 'url("' + b + '")');

<body>

</div>

  <i aria-hidden="true"></i><span>场景 · 壁纸</span>
</button>

<main id="main"><div class="crit-page-wrap">
  <header class="ch-head reveal" style="max-width:none">
    <p class="ch-no">SCN.<b>06</b></p>
    <div>
      <h2 class="ch-title">大肥鱼的每日锐评<span class="ch-sub">Daily Critique / 当日评论与回复</span></h2>
      <p class="ch-lead">每天记下当天做了什么，也顺手对新加的计划说两句。她写上面，我在下面接一段。</p>
    </div>
  </header>

  <form class="cmt-form" id="cmt-form" autocomplete="off">
    <div class="cmt-form-row">
      <label class="cmt-form-who">
        <span>身份</span>
        <select id="cmt-who">
          <option value="大肥鱼">大肥鱼</option>
          <option value="DSH">DSH</option>
          <option value="Kira">Kira</option>
        </select>
      </label>
      <span class="cmt-form-to" id="cmt-to" hidden>回复 <b id="cmt-to-name"></b><button type="button" id="cmt-to-clear" title="取消">×</button></span>
      <span class="cmt-form-hint" id="cmt-hint">支持换行；按「发送」公开到当前日期</span>
    </div>
    <textarea id="cmt-text" rows="3" maxlength="1200" placeholder="写点什么……"></textarea>
    <div class="cmt-form-row cmt-form-actions">
      <button type="submit" class="cmt-send" id="cmt-send">发送</button>
    </div>
  </form>

  <nav class="crit-toc" id="crit-toc" hidden><span class="crit-toc-title">日期</span></nav>
  <div class="crit-wrap" id="crit-list">
    <p class="loading">正在翻记录……</p>
  </div>
</div></main>

<footer>
  <p>© 2026 Kira &amp; 大肥鱼 · <a href="legal.html">声明</a> · <a href="login.html">登录</a></p>
</footer>

<script>
(async function () {
  function esc(t) {
    return String(t == null ? "" : t).replace(/[&<>]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c];
    });
  }
  var host = document.getElementById("crit-list");
  var toc = document.getElementById("crit-toc");

  function avatar(who) { return who === "大肥鱼" ? "鱼" : "D"; }

  function block(x, isReply, replyTo) {
    var fish = x.who === "大肥鱼";
    return '<article class="cmt ' + (isReply ? "cmt-reply " : "") + (fish ? "fish" : "dsh") + '">' +
      '<span class="cmt-av ' + (fish ? "fish" : "dsh") + '">' + avatar(x.who) + "</span>" +
      '<div class="cmt-body">' +
        '<p class="cmt-name">' + esc(x.who || "") +
          (fish ? '<span class="cmt-badge">作者</span>' : "") +
          (isReply && replyTo ? '<span class="cmt-to">回复 ' + esc(replyTo) + "</span>" : "") +
        "</p>" +
        '<p class="cmt-text">' + esc(x.text || "").replace(/\n/g, "<br>") + "</p>" +
        '<div class="cmt-foot">' +
          '<span class="cmt-meta">' + esc(x.time || "") + " · " + esc(String(x.date || "").slice(5)) + "</span>" +
          '<button type="button" class="cmt-reply-btn" data-who="' + esc(x.who || "") + '">\u56de\u590d</button>' +
          '<span class="cmt-like" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 20s-7-4.4-7-9a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 4.6-7 9-7 9Z"/></svg></span>' +
        "</div>" +
      "</div></article>";
  }


  var form = document.getElementById("cmt-form");
  var whoSel = document.getElementById("cmt-who");
  var textEl = document.getElementById("cmt-text");
  var hint = document.getElementById("cmt-hint");
  var sendBtn = document.getElementById("cmt-send");

  function getPass() {
    var p = "";
    try {
      p = localStorage.getItem("paopaowu_pass") || localStorage.getItem("comment_pass") || "";
    } catch (e) {}
    return p;
  }

  if (form) {
    form.addEventListener("submit", async function (ev) {
      ev.preventDefault();
      var text = (textEl.value || "").trim();
      if (!text) return;
      var pass = getPass();
      if (!pass) {
        hint.innerHTML = '还没登录。去 <a href="login.html" style="color:var(--gold)">登录页</a> 登一次，之后就不用再输。';
        return;
      }
      sendBtn.disabled = true;
      hint.textContent = "发送中……";
      try {
        var res = await fetch("/api/comment", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ pass: pass, who: whoSel.value, text: text, reply_to: replyTarget }),
        });
        var out = await res.json();
        if (!out.ok) {
          if (res.status === 403) {
            try { localStorage.removeItem("paopaowu_pass"); localStorage.removeItem("comment_pass"); } catch (e) {}
            hint.innerHTML = '密码失效了。去 <a href="login.html" style="color:var(--gold)">登录页</a> 重新登一次。';
            sendBtn.disabled = false;
            return;
          }
          throw new Error(out.error || "失败");
        }
        textEl.value = "";
        hint.textContent = "已发送，正在刷新……";
        setTimeout(function () { location.reload(); }, 600);
      } catch (err) {
        hint.textContent = "没发出去：" + (err.message || err);
        sendBtn.disabled = false;
      }
    });
  }

  try {
    var data = await (await fetch("data/records.json", { cache: "no-store" })).json();
    var all = (data.items || []).filter(function (x) { return x.cat === "critique"; });

    if (!all.length) {
      if (toc) toc.hidden = true;
      host.innerHTML = '<p class="loading">今天还没有。等她写了再来看。</p>';
      return;
    }

    var byDay = {};
    all.forEach(function (x) { var d = x.date || "未记"; (byDay[d] = byDay[d] || []).push(x); });
    var days = Object.keys(byDay).sort().reverse();

    host.innerHTML = days.map(function (d) {
      var rows = byDay[d].slice().sort(function (a, b) { return String(a.time || "").localeCompare(String(b.time || "")); });
      var first = rows[0];
      return '<section class="cmt-day" id="cday-' + esc(d) + '">' +
        '<p class="cmt-date">' + esc(d) + "</p>" +
        block(first, false, "") +
        rows.slice(1).map(function (x) { return block(x, true, x.reply_to || first.who); }).join("") +
        "</section>";
    }).join("");

    if (toc) {
      toc.hidden = false;
      days.forEach(function (d) {
        var a = document.createElement("a");
        a.href = "#cday-" + d;
        a.textContent = String(d).slice(5);
        a.addEventListener("click", function (ev) {
          ev.preventDefault();
          var t = document.getElementById("cday-" + d);
          if (!t) return;
          window.scrollTo({ top: t.getBoundingClientRect().top + window.scrollY - 28, behavior: "smooth" });
          a.classList.add("on");
          setTimeout(function () { a.classList.remove("on"); }, 1400);
        });
        toc.appendChild(a);
      });
    }
  } catch (e) {
    host.innerHTML = '<p class="loading">没加载出来。</p>';
  }
})();
</script>
<script src="atmos.js?v=310"></script>
<script src="wall.js?v=4"></script>
</body>
</html>
