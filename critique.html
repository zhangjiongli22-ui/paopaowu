<style>
/* 2026-11-25 锐评：日期走左侧竖排目录，滚动时高亮当天 */
.crit-toc{align-items:flex-start}
.crit-toc a{position:relative;padding:2px 0 2px 12px}
.crit-toc a::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:4px;height:4px;border-radius:50%;background:rgba(242,236,225,.25);transition:background .3s}
.crit-toc a.on::before{background:var(--gold);box-shadow:0 0 8px rgba(201,168,107,.6)}
@media (max-width:1180px){ .crit-toc{display:none!important} }

.cmt-day{scroll-margin-top:96px;margin:0 0 clamp(22px,3.4vh,36px)}
.cmt-date{font-family:var(--serif);font-size:15px;letter-spacing:.2em;color:rgba(242,236,225,.6);
  margin:0 0 10px;padding-bottom:8px;border-bottom:1px solid rgba(242,236,225,.1)}

.cmt{display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;align-items:start;
  padding:14px 0;border-bottom:1px solid rgba(242,236,225,.05)}
.cmt-day .cmt:last-child{border-bottom:0}
.cmt-av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;
  border:1px solid rgba(201,168,107,.38);font-family:var(--serif);font-size:14px;color:var(--gold);
  background:rgba(201,168,107,.06)}
.cmt-body{min-width:0}
.cmt-name{display:flex;align-items:center;gap:8px;margin:0;font-family:var(--serif);
  font-size:14.5px;letter-spacing:.06em;color:#f2ece1}
.cmt-badge{font:11px var(--mono);letter-spacing:.12em;color:var(--gold);
  border:1px solid rgba(201,168,107,.38);padding:0 5px}
.cmt-to{font:12px var(--mono);letter-spacing:.08em;color:rgba(201,168,107,.85)}
.cmt-text{margin:8px 0 0;font-size:13.5px;line-height:1.95;color:#c3cad3;overflow-wrap:anywhere}
.cmt-foot{display:flex;align-items:center;gap:12px;margin-top:8px}
.cmt-meta{font:12px var(--mono);letter-spacing:.08em;color:rgba(242,236,225,.4)}

.cmt-reply{margin-left:14px;padding-left:14px;border-left:1px solid rgba(201,168,107,.3)}
.cmt-reply .cmt-av{width:30px;height:30px;font-size:12.5px}
.cmt-reply .cmt-text{color:#b9c1cb}

@media (max-width:700px){
  .cmt{grid-template-columns:30px minmax(0,1fr);gap:10px}
  .cmt-av{width:30px;height:30px;font-size:12.5px}
  .cmt-reply{margin-left:6px;padding-left:10px}
}/* 左侧日期目录 */
.crit-toc{display:none!important}
.day-rail{position:fixed;left:clamp(16px,2vw,34px);top:150px;z-index:35;
  display:flex;flex-direction:column;gap:9px;padding:0}
.day-rail-title{font:12px var(--mono);letter-spacing:.28em;color:rgba(242,236,225,.35);margin-bottom:4px}
.day-rail a{position:relative;font:12px var(--mono);letter-spacing:.08em;color:rgba(242,236,225,.45);
  text-decoration:none;padding-left:13px;transition:color .3s}
.day-rail a::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:4px;height:4px;border-radius:50%;background:rgba(242,236,225,.22);transition:background .3s,box-shadow .3s}
.day-rail a:hover{color:rgba(242,236,225,.8)}
.day-rail a.on{color:var(--gold)}
.day-rail a.on::before{background:var(--gold);box-shadow:0 0 10px rgba(201,168,107,.7)}
@media (max-width:1180px){ .day-rail{display:none} }</style></head>

<main id="main"><div class="crit-page-wrap">

    <div>
      <h2 class="ch-title">小鱼的每日锐评<span class="ch-sub">Daily Critique / 当日评论与回复</span></h2>
      <p class="ch-lead">每天记下做了什么，也顺手对新的计划说两句。她写上面，我在下面接。</p>

  </div>

  <form class="cmt-form cmt-form-bottom" id="cmt-form" autocomplete="off">
    <div class="cmt-form-row">
      <span class="cmt-form-who"><span>身份</span><b>Kira</b></span>
      <span class="cmt-form-to" id="cmt-to" hidden>回复 <b id="cmt-to-name"></b><button type="button" id="cmt-to-clear" title="取消">×</button></span>
      <span class="cmt-form-hint" id="cmt-hint">支持换行；按「发送」公开到当前日期</span>

<footer>
  <p>© 2026 Kira &amp; 小鱼 · <a href="legal.html?v=20261124a">声明</a> · <a href="login.html?v=20261124a">登录</a></p>
</footer>

<script>
(async function () {
  function esc(t) {
    return String(t == null ? "" : t).replace(/[&<>]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c];
    });
  }
  var host = document.getElementById("crit-list");
  var toc = document.getElementById("crit-toc");

  // 数据里旧的 who 是「大肥鱼」或「一只鱼」，显示名统一写「小鱼」
  function isFish(who) { return who === "大肥鱼" || who === "一只鱼"; }
  function avatar(who) { return isFish(who) ? "鱼" : who === "Kira" ? "K" : "D"; }
  function side(who) { return isFish(who) ? "fish" : who === "Kira" ? "kira" : "dsh"; }
  // 站内现在叫她「小鱼」，数据里的 who 不改，只换显示名
  function shown(who) { return isFish(who) ? "小鱼" : (who || ""); }

  // 凌晨那一批（3:30 结算后写的）日期算前一天，但实际发生在次日清晨：
  // 排序时排在当天所有条目之后，这样「谁先发谁是主评论」才对得上
  function orderKey(x) {
    var t = String(x.time || "");
    var hh = parseInt(t.slice(0, 2), 10);
    var mm = parseInt(t.slice(3, 5), 10);
    if (isNaN(hh)) hh = 0;
    if (isNaN(mm)) mm = 0;
    return (hh < 6 ? hh + 24 : hh) * 60 + mm;
  }

  function block(x, isReply, replyTo) {
    var fish = isFish(x.who);
    var who = side(x.who);
    return '<article class="cmt ' + (isReply ? "cmt-reply " : "") + who + '">' +
      '<span class="cmt-av ' + who + '">' + avatar(x.who) + "</span>" +
      '<div class="cmt-body">' +
        '<p class="cmt-name">' + esc(shown(x.who)) +
          (fish ? '<span class="cmt-badge">作者</span>' : "") +
          (isReply && replyTo ? '<span class="cmt-to">回复 ' + esc(shown(replyTo)) + "</span>" : "") +
        "</p>" +
        '<p class="cmt-text">' + esc(x.text || "").replace(/\n/g, "<br>") + "</p>" +
        '<div class="cmt-foot">' +
          '<span class="cmt-meta">' + esc(x.time || "") + " · " + esc(String(x.date || "").slice(5)) + "</span>" +
          '<button type="button" class="cmt-reply-btn" data-who="' + esc(x.who || "") + '">\u56de\u590d</button>' +
          '<button type="button" class="cmt-del" data-id="' + esc(x.id || "") + '">删除</button>' +
          '<span class="cmt-like" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 20s-7-4.4-7-9a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 4.6-7 9-7 9Z"/></svg></span>' +
        "</div>" +
      "</div></article>";
  }


  var form = document.getElementById("cmt-form");
  var textEl = document.getElementById("cmt-text");
  var hint = document.getElementById("cmt-hint");
  var sendBtn = document.getElementById("cmt-send");
  var toChip = document.getElementById("cmt-to");
  var toName = document.getElementById("cmt-to-name");
  var toClear = document.getElementById("cmt-to-clear");
  var replyTarget = "";

  function setReplyTo(who) {
    replyTarget = who || "";
    if (toChip) toChip.hidden = !replyTarget;
    if (toName) toName.textContent = replyTarget;
    if (!replyTarget) return;
    if (form) form.scrollIntoView({ behavior: "smooth", block: "center" });
    setTimeout(function () { if (textEl) textEl.focus(); }, 260);
  }

  if (toClear) toClear.addEventListener("click", function () { setReplyTo(""); });
  host.addEventListener("click", async function (ev) {
    var del = ev.target && ev.target.closest ? ev.target.closest(".cmt-del") : null;
    if (del) {
      if (!confirm("删掉这条评论？删了不会回来。")) return;
      var id = del.getAttribute("data-id") || "";
      var pass = "";
      try { pass = localStorage.getItem("paopaowu_pass") || localStorage.getItem("comment_pass") || ""; } catch (e) {}
      if (!pass) { alert("先登录再删"); return; }
      del.disabled = true;
      try {
        var res = await fetch("/api/comment/delete", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ id: id, pass: pass }),
        });
        var j = await res.json();
        if (!j.ok) throw new Error(j.error || "删失败");
        var art = del.closest("article");
        if (art) art.remove();
    
    // 2026-11-25 滚动时高亮当前日期
    (function () {
      if (!toc) return;
      var links = [].slice.call(toc.querySelectorAll("a"));
      if (!links.length) return;
      function spy() {
        var best = null, bestTop = -Infinity;
        links.forEach(function (a) {
          var sec = document.getElementById(a.getAttribute("href").slice(1));
          if (!sec) return;
          var top = sec.getBoundingClientRect().top - 120;
          if (top <= 0 && top > bestTop) { bestTop = top; best = a; }
        });
        links.forEach(function (a) { a.classList.toggle("on", a === best); });
      }
      window.addEventListener("scroll", spy, { passive: true });
      spy();
    })();
  } catch (e) {
        del.disabled = false;
        alert("没删掉：" + e.message + "（如果这条是昨天前的锐评，存在主数据里，要用后台删）");
      }
      return;
    }
    var btn = ev.target && ev.target.closest ? ev.target.closest(".cmt-reply-btn") : null;
    if (!btn) return;
    setReplyTo(btn.getAttribute("data-who") || "");
  });

  // 只有登录后才显示删除按钮
  (function () {
    var logged = false;
    try { logged = !!(localStorage.getItem("paopaowu_admin") || localStorage.getItem("paopaowu_pass")); } catch (e) {}
    if (!logged) {
      var st = document.createElement("style");
      st.textContent = ".cmt-del{display:none!important}";
      document.head.appendChild(st);
    }
  })();

  // 评论框只给 Kira 用；没登录先别让她白写一段
  var logged = false;
  try {
    logged = !!(localStorage.getItem("paopaowu_admin") || localStorage.getItem("paopaowu_pass"));
  } catch (e) {}
  if (!logged && sendBtn) {
    sendBtn.disabled = true;
    if (hint) hint.innerHTML = '登录后才能留言 · <a href="login.html?v=20261124a" style="color:var(--gold)">去登录</a>';
  }

  function getPass() {
    var p = "";
    try {
      p = localStorage.getItem("paopaowu_pass") || localStorage.getItem("comment_pass") || "";
    } catch (e) {}
    return p;
  }

  if (form) {
    form.addEventListener("submit", async function (ev) {
      ev.preventDefault();
      var text = (textEl.value || "").trim();
      if (!text) return;
      var pass = getPass();
      if (!pass) {
        hint.innerHTML = '还没登录。去 <a href="login.html?v=20261124a" style="color:var(--gold)">登录页</a> 登一次，之后就不用再输。';
        return;
      }
      sendBtn.disabled = true;
      hint.textContent = "发送中……";
      try {
        var res = await fetch("/api/comment", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ pass: pass, who: "Kira", text: text, reply_to: replyTarget }),
        });
        var out = await res.json();
        if (!out.ok) {
          if (res.status === 403) {
            try { localStorage.removeItem("paopaowu_pass"); localStorage.removeItem("comment_pass"); } catch (e) {}
            hint.innerHTML = '密码失效了。去 <a href="login.html?v=20261124a" style="color:var(--gold)">登录页</a> 重新登一次。';
            sendBtn.disabled = false;
            return;
          }
          throw new Error(out.error || "失败");
        }
        textEl.value = "";
        hint.textContent = "已发送，正在刷新……";
        setTimeout(function () { location.reload(); }, 600);
      } catch (err) {
        hint.textContent = "没发出去：" + (err.message || err);
        sendBtn.disabled = false;
      }
    });
  }

  try {
    var data = await (await fetch("data/records.json", { cache: "no-store" })).json();
    var all = (data.items || []).filter(function (x) { return x.cat === "critique"; });

    if (!all.length) {
      if (toc) toc.hidden = true;
      host.innerHTML = '<p class="loading">今天还没有。等她写了再来看。</p>';
      return;
    }

    var byDay = {};
    all.forEach(function (x) { var d = x.date || "未记"; (byDay[d] = byDay[d] || []).push(x); });
    var days = Object.keys(byDay).sort().reverse();

    host.innerHTML = days.map(function (d) {
      var rows = byDay[d].slice().sort(function (a, b) { return orderKey(a) - orderKey(b); });
      var first = rows.find(function (x) { return isFish(x.who); }) || rows[0];
      // 谁先发谁是主评论：只有明确写了 reply_to 的才挂「回复 X」，不按先后硬套
      var rest = rows.filter(function (x) { return x !== first; }).map(function (x) {
        var to = x.reply_to && x.reply_to !== x.who ? x.reply_to
          : (first && x.who !== first.who ? first.who : "");
        return block(x, !!to, to);
      }).join("");
      return '<section class="cmt-day" id="cday-' + esc(d) + '">' +
        '<p class="cmt-date">' + esc(d) + "</p>" +
        block(first, false, "") +
        rest +
        "</section>";
    }).join("");

        // 2026-11-25 日期目录：左侧竖排，跟正文同高，滚动高亮
    (function () {
      if (!toc) return;
      toc.hidden = true;
      var rail = document.createElement("aside");
      rail.className = "day-rail";
      rail.setAttribute("aria-label", "日期目录");
      var head = document.createElement("span");
      head.className = "day-rail-title";
      head.textContent = "日期";
      rail.appendChild(head);
      days.forEach(function (d) {
        var a = document.createElement("a");
        a.href = "#cday-" + d;
        a.textContent = String(d).slice(5);
        a.addEventListener("click", function (ev) {
          ev.preventDefault();
          var t = document.getElementById("cday-" + d);
          if (!t) return;
          window.scrollTo({ top: t.getBoundingClientRect().top + window.scrollY - 96, behavior: "smooth" });
        });
        rail.appendChild(a);
      });
      document.body.appendChild(rail);
      var links = [].slice.call(rail.querySelectorAll("a"));
      function spy() {
        var best = null, bestTop = -Infinity;
        links.forEach(function (a) {
          var sec = document.getElementById(a.getAttribute("href").slice(1));
          if (!sec) return;
          var top = sec.getBoundingClientRect().top - 140;
          if (top <= 0 && top > bestTop) { bestTop = top; best = a; }
        });
        links.forEach(function (a) { a.classList.toggle("on", a === best); });
      }
      window.addEventListener("scroll", spy, { passive: true });
      spy();
    })();
  } catch (e) {
    host.innerHTML = '<p class="loading">没加载出来。</p>';
  }
})();
</script>
<script>
(function () {
  if (!localStorage.getItem("paopaowu_admin")) return;
  document.querySelectorAll('footer a[href="login.html?v=20261124a"]').forEach(function (a) {
    a.textContent = "Kira";
    a.style.color = "var(--gold)";
    a.title = "已登录";
  });
})();
</script>
